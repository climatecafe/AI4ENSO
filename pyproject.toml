[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4enso"
version = "0.2.0"
description = "ENSO indices, conceptual dynamics, predictability and signal-to-noise diagnostics, and AI emulators"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
data = ["xarray>=2023.1", "netCDF4", "dask"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["ai4enso*"]
